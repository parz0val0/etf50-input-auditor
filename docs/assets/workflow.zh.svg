<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="480" height="1120" viewBox="0 0 480 1120"><title id="title">从CSV到可追溯的审阅</title><desc id="desc">四步流程，证据仍需由人核实。 拿到资料 保留原始文件。 先读供应商字段字典。 有价格列，不等于有证据。 发现问题 预检只建议字段映射。 检查器指出矛盾与缺项。 缺失证据始终保留。 由人确认修正 人工确认映射和单位。 使用真实可知的早期观测。 绝不编造缺失证据。 重新检查 用已确认的输入重新运行。 分开看历史IV和配对状态。 条件相容，不等于数据认证。</desc><rect width="480" height="1120" rx="16" fill="#f6f8fa"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" fill="#1f2937"><text x="24" y="38" font-size="25" font-weight="700">从CSV到可追溯的审阅</text><text x="24" y="71" font-size="19" fill="#475569">四步流程，证据仍需由人核实。</text><rect x="16" y="96" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="130" r="17" fill="#25635a"/><text x="44" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="73" y="138" font-size="26" font-weight="700">拿到资料</text><g transform="translate(392 104)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="55" height="66" rx="7"/><path d="M12 17h31M12 30h31M12 43h22"/></g><text x="33" y="197" font-size="21">保留原始文件。</text><text x="33" y="236" font-size="21">先读供应商字段字典。</text><text x="33" y="275" font-size="21">有价格列，不等于有证据。</text><path d="M240 325v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="16" y="345" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="379" r="17" fill="#25635a"/><text x="44" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="73" y="387" font-size="26" font-weight="700">发现问题</text><g transform="translate(392 353)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M29 0L58 54H0Z"/><path d="M29 17v18M29 43v1"/></g><text x="33" y="446" font-size="21">预检只建议字段映射。</text><text x="33" y="485" font-size="21">检查器指出矛盾与缺项。</text><text x="33" y="524" font-size="21">缺失证据始终保留。</text><path d="M240 574v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="16" y="594" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="628" r="17" fill="#25635a"/><text x="44" y="635" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="73" y="636" font-size="26" font-weight="700">由人确认修正</text><g transform="translate(392 602)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="15" r="11"/><path d="M0 51q0-21 18-21t18 21M40 14h17v38H40M44 27l4 4 7-9"/></g><text x="33" y="695" font-size="21">人工确认映射和单位。</text><text x="33" y="734" font-size="21">使用真实可知的早期观测。</text><text x="33" y="773" font-size="21">绝不编造缺失证据。</text><path d="M240 823v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="16" y="843" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="877" r="17" fill="#25635a"/><text x="44" y="884" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="73" y="885" font-size="26" font-weight="700">重新检查</text><g transform="translate(392 851)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="43" height="58" rx="6"/><path d="M9 14h24M9 25h18"/><circle cx="42" cy="44" r="14"/><path d="M52 54l11 11"/></g><text x="33" y="944" font-size="21">用已确认的输入重新运行。</text><text x="33" y="983" font-size="21">分开看历史IV和配对状态。</text><text x="33" y="1022" font-size="21">条件相容，不等于数据认证。</text><text x="24" y="1100" font-size="18" fill="#475569">合成示例 · 不自动修复或认证</text></g></svg>