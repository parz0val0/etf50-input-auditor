<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="480" height="1120" viewBox="0 0 480 1120"><title id="title">From CSV to a traceable review</title><desc id="desc">Four steps. Evidence stays in your hands. Receive the CSV Keep the original file. Read the supplier dictionary. A price column is not proof. Find the gaps Preflight suggests column names. Audit flags conflicts and gaps. Missing evidence stays visible. A person reviews Confirm the mapping and units. Use genuine earlier observations. Never invent missing evidence. Check again Rerun with the confirmed input. Read each purpose separately. Consistent does not mean certified.</desc><rect width="480" height="1120" rx="16" fill="#f6f8fa"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" fill="#1f2937"><text x="24" y="38" font-size="25" font-weight="700">From CSV to a traceable review</text><text x="24" y="71" font-size="19" fill="#475569">Four steps. Evidence stays in your hands.</text><rect x="16" y="96" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="130" r="17" fill="#25635a"/><text x="44" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="73" y="138" font-size="26" font-weight="700">Receive the CSV</text><g transform="translate(392 104)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="55" height="66" rx="7"/><path d="M12 17h31M12 30h31M12 43h22"/></g><text x="33" y="197" font-size="21">Keep the original file.</text><text x="33" y="236" font-size="21">Read the supplier dictionary.</text><text x="33" y="275" font-size="21">A price column is not proof.</text><path d="M240 325v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="16" y="345" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="379" r="17" fill="#25635a"/><text x="44" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="73" y="387" font-size="26" font-weight="700">Find the gaps</text><g transform="translate(392 353)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M29 0L58 54H0Z"/><path d="M29 17v18M29 43v1"/></g><text x="33" y="446" font-size="21">Preflight suggests column names.</text><text x="33" y="485" font-size="21">Audit flags conflicts and gaps.</text><text x="33" y="524" font-size="21">Missing evidence stays visible.</text><path d="M240 574v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="16" y="594" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="628" r="17" fill="#25635a"/><text x="44" y="635" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="73" y="636" font-size="26" font-weight="700">A person reviews</text><g transform="translate(392 602)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="15" r="11"/><path d="M0 51q0-21 18-21t18 21M40 14h17v38H40M44 27l4 4 7-9"/></g><text x="33" y="695" font-size="21">Confirm the mapping and units.</text><text x="33" y="734" font-size="21">Use genuine earlier observations.</text><text x="33" y="773" font-size="21">Never invent missing evidence.</text><path d="M240 823v14m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"/><rect x="16" y="843" width="448" height="225" rx="16" fill="#fff" stroke="#cbd5e1"/><circle cx="44" cy="877" r="17" fill="#25635a"/><text x="44" y="884" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="73" y="885" font-size="26" font-weight="700">Check again</text><g transform="translate(392 851)" stroke="#25635a" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="0" width="43" height="58" rx="6"/><path d="M9 14h24M9 25h18"/><circle cx="42" cy="44" r="14"/><path d="M52 54l11 11"/></g><text x="33" y="944" font-size="21">Rerun with the confirmed input.</text><text x="33" y="983" font-size="21">Read each purpose separately.</text><text x="33" y="1022" font-size="21">Consistent does not mean certified.</text><text x="24" y="1100" font-size="18" fill="#475569">Synthetic example · no automatic repair</text></g></svg>